<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
       background: #1a1a1a; color: #f0f0f0; width: 320px; padding: 14px; }

h1 { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 14px;
     display: flex; align-items: center; gap: 8px; }
h1 span { font-size: 18px; }

/* current page card */
#pageCard { background: #2a2a2a; border-radius: 8px; padding: 12px;
            margin-bottom: 12px; border: 1px solid #333; }
#pageCard.detected { border-color: #4ade80; }
#pageCard.not-portal { border-color: #555; }
.card-label { font-size: 11px; color: #888; text-transform: uppercase;
              letter-spacing: .05em; margin-bottom: 4px; }
#modelName { font-size: 14px; font-weight: 500; color: #fff; margin-bottom: 2px;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#matNum    { font-size: 11px; color: #888; margin-bottom: 10px; }
#addBtn { width: 100%; padding: 8px; border-radius: 6px; border: none; cursor: pointer;
          font-size: 13px; font-weight: 500; background: #4ade80; color: #111; }
#addBtn:hover { background: #22c55e; }
#addBtn:disabled { background: #333; color: #666; cursor: default; }

/* model list */
.section-label { font-size: 11px; color: #888; text-transform: uppercase;
                 letter-spacing: .05em; margin-bottom: 6px; }
#modelList { margin-bottom: 12px; }
.model-row { display: flex; align-items: center; justify-content: space-between;
             padding: 7px 10px; background: #2a2a2a; border-radius: 6px;
             margin-bottom: 4px; border: 1px solid #333; }
.model-row-name { font-size: 13px; color: #f0f0f0; flex: 1;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.model-row-num  { font-size: 11px; color: #666; margin: 0 8px; }
.remove-btn { background: none; border: none; color: #666; cursor: pointer;
              font-size: 16px; line-height: 1; padding: 0 2px; }
.remove-btn:hover { color: #ef4444; }
#emptyMsg { font-size: 13px; color: #666; padding: 8px 0; text-align: center; }

/* build button */
#buildBtn { width: 100%; padding: 10px; border-radius: 7px; border: none;
            cursor: pointer; font-size: 13px; font-weight: 600;
            background: #3b82f6; color: #fff; }
#buildBtn:hover { background: #2563eb; }
#buildBtn:disabled { background: #333; color: #666; cursor: default; }

/* status */
#status { margin-top: 10px; font-size: 12px; color: #aaa; text-align: center;
          min-height: 16px; }
#status.ok  { color: #4ade80; }
#status.err { color: #ef4444; }

/* not-on-portal message */
#notPortalMsg { font-size: 13px; color: #888; text-align: center; padding: 4px 0 10px; }
a { color: #3b82f6; text-decoration: none; }
a:hover { text-decoration: underline; }

/* name edit */
#nameEdit { width: 100%; background: #111; border: 1px solid #555; border-radius: 5px;
            color: #fff; font-size: 13px; padding: 6px 8px; margin-bottom: 8px; }
#nameEdit:focus { outline: none; border-color: #4ade80; }
</style>
</head>
<body>
<h1><span>🔧</span> Stihl Parts Collector</h1>

<div id="pageCard" class="not-portal">
  <div class="card-label">Current page</div>
  <div id="modelName">—</div>
  <div id="matNum"></div>
  <input id="nameEdit" type="text" placeholder="Model name" style="display:none">
  <button id="addBtn" disabled>Open an IPL page on the Stihl portal</button>
</div>

<div id="notPortalMsg" style="display:none">
  Navigate to <a href="https://ssc.stihl.com" target="_blank">ssc.stihl.com</a>
  and open any model's IPL page.
</div>

<div class="section-label">Saved models</div>
<div id="modelList"><div id="emptyMsg">No models yet</div></div>

<button id="buildBtn" disabled>Build &amp; Download CSV</button>
<div id="status"></div>

<script src="popup.js"></script>
</body>
</html>
