<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
       background: #1a1a1a; color: #f0f0f0; width: 340px; padding: 14px; }

h1 { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 14px; }

/* token bar */
#tokenBar { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
            background: #2a2a2a; border-radius: 7px; margin-bottom: 14px;
            border: 1px solid #333; font-size: 12px; }
#tokenDot  { width: 8px; height: 8px; border-radius: 50%; background: #666; flex-shrink: 0; }
#tokenDot.ok  { background: #4ade80; }
#tokenDot.err { background: #ef4444; }
#tokenMsg  { flex: 1; color: #888; }
#tokenMsg.ok { color: #4ade80; }
#tokenMsg.err { color: #ef4444; }

/* search row */
.search-row { display: flex; gap: 6px; margin-bottom: 10px; }
#searchInput { flex: 1; background: #2a2a2a; border: 1px solid #444; border-radius: 6px;
               color: #fff; font-size: 13px; padding: 7px 10px; }
#searchInput:focus { outline: none; border-color: #3b82f6; }
#searchInput::placeholder { color: #555; }
#searchBtn { padding: 7px 14px; border-radius: 6px; border: none; cursor: pointer;
             font-size: 13px; font-weight: 500; background: #3b82f6; color: #fff;
             white-space: nowrap; }
#searchBtn:hover { background: #2563eb; }
#searchBtn:disabled { background: #333; color: #666; cursor: default; }

/* search results dropdown */
#searchResults { background: #2a2a2a; border: 1px solid #444; border-radius: 7px;
                 margin-bottom: 10px; display: none; overflow: hidden; }
.result-item { padding: 9px 12px; cursor: pointer; border-bottom: 1px solid #333;
               font-size: 13px; }
.result-item:last-child { border-bottom: none; }
.result-item:hover { background: #333; }
.result-name { color: #f0f0f0; }
.result-mn   { font-size: 11px; color: #666; margin-top: 2px; }
#noResults { padding: 10px 12px; font-size: 13px; color: #888; }

/* model list */
.section-label { font-size: 11px; color: #666; text-transform: uppercase;
                 letter-spacing: .05em; margin-bottom: 6px; }
#modelList { margin-bottom: 12px; max-height: 180px; overflow-y: auto; }
.model-row { display: flex; align-items: center; padding: 7px 10px;
             background: #2a2a2a; border-radius: 6px; margin-bottom: 4px;
             border: 1px solid #333; gap: 8px; }
.model-row-name { flex: 1; font-size: 13px; color: #f0f0f0;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.model-row-mn   { font-size: 11px; color: #555; flex-shrink: 0; }
.remove-btn { background: none; border: none; color: #555; cursor: pointer;
              font-size: 16px; line-height: 1; padding: 0; flex-shrink: 0; }
.remove-btn:hover { color: #ef4444; }
#emptyMsg { font-size: 13px; color: #555; text-align: center; padding: 12px 0; }

/* build button */
#buildBtn { width: 100%; padding: 10px; border-radius: 7px; border: none;
            cursor: pointer; font-size: 13px; font-weight: 600;
            background: #4ade80; color: #111; }
#buildBtn:hover { background: #22c55e; }
#buildBtn:disabled { background: #2a2a2a; color: #555; cursor: default;
                     border: 1px solid #333; }

/* status */
#status { margin-top: 9px; font-size: 12px; color: #888; text-align: center;
          min-height: 16px; line-height: 1.5; }
#status.ok  { color: #4ade80; }
#status.err { color: #ef4444; }

/* link */
a { color: #3b82f6; text-decoration: none; }
a:hover { text-decoration: underline; }

/* spinner */
@keyframes spin { to { transform: rotate(360deg); } }
.spin { display: inline-block; animation: spin .7s linear infinite; }
</style>
</head>
<body>

<h1>🔧 Stihl Parts Collector</h1>

<div id="tokenBar">
  <div id="tokenDot"></div>
  <span id="tokenMsg">Checking login…</span>
</div>

<div class="search-row">
  <input id="searchInput" type="text" placeholder="Type model name, e.g. BR 800">
  <button id="searchBtn">Search</button>
</div>
<div id="searchResults"></div>

<div class="section-label">Models to collect</div>
<div id="modelList"><div id="emptyMsg">Search for models above to add them</div></div>

<button id="buildBtn" disabled>Build &amp; Download CSV</button>
<div id="status"></div>

<script src="popup.js"></script>
</body>
</html>
